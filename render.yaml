# Render Blueprint for the Google Ads MCP server.
# https://render.com/docs/blueprint-spec
#
# The web service runs the OAuth proxy over Streamable HTTP at /mcp. OAuth
# state is stored in an existing private Render Key Value (Redis) instance so
# client registrations and tokens survive restarts and redeploys.

services:
  - type: web
    name: google-ads-mcp
    runtime: docker
    # The free plan spins down when idle; the resulting cold starts make MCP
    # clients time out during the OAuth flow.
    plan: starter
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeploy: true
    envVars:
      # Render passes environment variables to the Docker build as build args.
      - key: EXTRAS
        value: redis
      - key: GOOGLE_ADS_MCP_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_ADS_MCP_OAUTH_CLIENT_SECRET
        sync: false
      # No developer token: since 2026-09-09 API access levels come from the
      # Cloud project that owns the OAuth client above.
      # Optional: set only when reaching client accounts through a manager
      # account; the per-call login_customer_id parameter overrides it.
      - key: GOOGLE_ADS_LOGIN_CUSTOMER_ID
        sync: false
      # Leave unset to use the onrender.com URL (RENDER_EXTERNAL_URL). Set it
      # when serving the MCP endpoint from a custom domain.
      - key: GOOGLE_ADS_MCP_BASE_URL
        sync: false
      - key: GOOGLE_ADS_MCP_JWT_SIGNING_KEY
        generateValue: true
      - key: GOOGLE_ADS_MCP_STORAGE_ENCRYPTION_KEY
        generateValue: true
      - key: GOOGLE_ADS_MCP_STORAGE_TYPE
        value: redis
      # Internal URL of an existing Key Value instance, including a dedicated
      # database index (e.g. redis://<user>:<password>@<host>:6379/4). It holds
      # a password, so it is entered in the dashboard and never committed.
      - key: GOOGLE_ADS_MCP_STORAGE_REDIS_URL
        sync: false
